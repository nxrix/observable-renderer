<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://nxrix.github.io/theme/assets/styles/notebook.css">
  <title>Notebook</title>
</head>
<body>
  <script type="module">
    import { render } from "../src/renderer.js";
    render([
      { value: "# Hello", type: "md" },
      `viewof a = Inputs.range([0,100],{ label: "A", step: 1, value: 1 })`,
      `viewof b = Inputs.range([0,100],{ label: "B", step: 1, value: 2 })`,
      `tex\`sum = \${a+b}\``
    ]);
  </script>
</body>
</html>
